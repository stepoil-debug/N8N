name: step-audit-n8n

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Set N8N_VERSION in .env}
  restart: unless-stopped
  env_file:
    - .env
  environment: &n8n-environment
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
    DB_POSTGRESDB_USER: ${N8N_DB_USER}
    DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
    DB_POSTGRESDB_POOL_SIZE: ${N8N_DB_POOL_SIZE:-10}
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
    QUEUE_BULL_REDIS_DB: 0
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_HOST: ${N8N_DOMAIN}
    N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
    N8N_PORT: 5678
    N8N_EDITOR_BASE_URL: ${N8N_PROTOCOL:-https}://${N8N_DOMAIN}/
    WEBHOOK_URL: ${N8N_PROTOCOL:-https}://${N8N_DOMAIN}/
    N8N_PROXY_HOPS: 1
    N8N_SECURE_COOKIE: "true"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    N8N_RUNNERS_ENABLED: "true"
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE_HOURS:-336}
    EXECUTIONS_DATA_SAVE_ON_ERROR: all
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
    TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  n8n-main:
    <<: *n8n-common
    command: start
    volumes:
      - n8n_main_data:/home/node/.n8n
    expose:
      - "5678"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - backend

  n8n-worker:
    <<: *n8n-common
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-5}
    deploy:
      replicas: 1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10

  audit-api:
    build:
      context: ../services/audit-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${AUDIT_API_LOG_LEVEL:-INFO}
      WORKERS: ${AUDIT_API_WORKERS:-2}
      AUDIT_API_SHARED_SECRET: ${AUDIT_API_SHARED_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_PRIVATE_BUCKET: ${SUPABASE_PRIVATE_BUCKET:-audit-private}
      MODEL_PROVIDER: ${MODEL_PROVIDER}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_NAME: ${MODEL_NAME}
      OCR_PROVIDER: ${OCR_PROVIDER:-disabled}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      n8n-main:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  n8n_main_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
