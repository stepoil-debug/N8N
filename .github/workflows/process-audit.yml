name: Process STEP Audit Queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/process-audit.yml'
      - 'scripts/queue_worker.py'
      - 'scripts/process_queued_job.py'
      - 'scripts/execute_audit_cli.py'
      - 'scripts/build_cli_workflow.py'
      - 'workflows/40-auditoria-completa.json'
      - 'apps/document-api/**'
      - 'knowledge/**'

permissions:
  contents: read
  id-token: write
  models: read

concurrency:
  group: step-audit-queue-worker
  cancel-in-progress: false

jobs:
  process-next-job:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      STEP_AUDIT_QUEUE_URL: https://qxmxtbjxkhecqilpnhgq.supabase.co/functions/v1/step-audit-queue
      STEP_AUDIT_JOB_FILE: /tmp/step-audit-job.json
      STEP_AUDIT_RESULT_FILE: /tmp/step-audit-result.json
      STEP_AUDIT_INPUT_FILE: /tmp/step-audit-input.zip
      STEP_AUDIT_PAYLOAD_PATH: /tmp/step-audit-n8n-input.json
      STEP_AUDIT_WORKFLOW_OUTPUT: /tmp/audit-workflow.json
      STEP_AUDIT_WORKFLOW_ID: STEP_AUDIT_FULL_01
      DOCUMENT_API_PUBLIC_URL: http://127.0.0.1:8000
      DOCUMENT_API_URL: http://127.0.0.1:8000
      DOCUMENT_API_KEY: step-audit-actions
      API_KEY: step-audit-actions
      ARTIFACT_ROOT: /tmp/step-audit-artifacts
      MAX_UPLOAD_MB: '300'
      MAX_PACKAGE_MB: '250'
      MAX_ZIP_ENTRIES: '2500'
      MAX_ZIP_UNCOMPRESSED_MB: '1500'
      N8N_ENCRYPTION_KEY: step-audit-ephemeral-actions-key-2026
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      NODE_FUNCTION_ALLOW_BUILTIN: fs
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'false'
      N8N_LOG_LEVEL: warn
      LLM_BASE_URL: https://models.github.ai/inference/chat/completions
      LLM_MODEL: openai/gpt-4.1-mini
      DRAWING_VISION_MODEL: openai/gpt-4.1-mini
      DRAWING_VISION_MAX_PAGES: '8'
      DRAWING_VISION_MAX_DETAIL_TILES: '1'
      DRAWING_VISION_DPI: '190'
      DRAWING_VISION_MAX_IMAGE_DIMENSION: '2600'
      DRAWING_VISION_MIN_INTERVAL_SECONDS: '5'
      DRAWING_VISION_MAX_RETRIES: '3'
      DRAWING_VISION_MAX_TOKENS: '2600'
      DRAWING_KNOWLEDGE_PATH: knowledge/offshore_drawing_rules.json
      CLIENT_KNOWLEDGE_ROOT: knowledge/clients
      DRAWING_AUDIT_MAX_FILES: '24'
      DRAWING_AUDIT_MAX_CONDITION_FILES: '10'
      DRAWING_AUDIT_MAX_CONDITION_CHUNKS: '10'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/document-api/requirements.txt

      - name: Install queue client
        run: python -m pip install --disable-pip-version-check httpx==0.28.1

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('step-audit-worker');
            core.setSecret(token);
            core.exportVariable('WORKER_OIDC_TOKEN', token);

      - name: Claim next queued audit
        id: claim
        run: python scripts/queue_worker.py claim

      - name: Download private ZIP
        if: steps.claim.outputs.has_job == 'true'
        run: python scripts/queue_worker.py download

      - name: Install document system dependencies
        if: steps.claim.outputs.has_job == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng

      - name: Install document API
        if: steps.claim.outputs.has_job == 'true'
        run: python -m pip install --disable-pip-version-check -r apps/document-api/requirements.txt

      - name: Set up Node.js
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install n8n
        if: steps.claim.outputs.has_job == 'true'
        run: npm install --global n8n@2.30.5

      - name: Build and import CLI audit workflow
        if: steps.claim.outputs.has_job == 'true'
        run: |
          python scripts/build_cli_workflow.py
          python -m json.tool "$STEP_AUDIT_WORKFLOW_OUTPUT" >/dev/null
          n8n import:workflow --input="$STEP_AUDIT_WORKFLOW_OUTPUT"

      - name: Start document API
        if: steps.claim.outputs.has_job == 'true'
        env:
          LLM_API_KEY: ${{ github.token }}
          PYTHONPATH: apps/document-api
        run: |
          python -m uvicorn app.cors_entrypoint:app --host 127.0.0.1 --port 8000 > /tmp/document-api.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Document API log:'
          cat /tmp/document-api.log || true
          exit 1

      - name: Execute queued analysis
        if: steps.claim.outputs.has_job == 'true'
        env:
          LLM_API_KEY: ${{ github.token }}
        run: python scripts/process_queued_job.py

      - name: Refresh OIDC token for publishing
        if: steps.claim.outputs.has_job == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('step-audit-worker');
            core.setSecret(token);
            core.exportVariable('WORKER_OIDC_TOKEN', token);

      - name: Publish generated artifacts
        if: steps.claim.outputs.has_job == 'true' && success()
        run: python scripts/queue_worker.py publish

      - name: Refresh OIDC token for failure reporting
        if: failure() && steps.claim.outputs.has_job == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('step-audit-worker');
            core.setSecret(token);
            core.exportVariable('WORKER_OIDC_TOKEN', token);

      - name: Mark job as failed
        if: failure() && steps.claim.outputs.has_job == 'true'
        run: python scripts/queue_worker.py fail "A execução GitHub Actions $GITHUB_RUN_ID falhou. Consulte os logs do workflow Process STEP Audit Queue."

      - name: Clean temporary documents
        if: always()
        run: |
          rm -f /tmp/step-audit-input.zip /tmp/step-audit-job.json /tmp/step-audit-result.json /tmp/step-audit-n8n-input.json /tmp/audit-workflow.json
          rm -rf /tmp/step-audit-artifacts
