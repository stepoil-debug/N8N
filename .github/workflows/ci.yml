name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audit-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("schemas").rglob("*.json")) + sorted(Path("n8n/workflows").glob("*.json"))
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"valid: {path}")
          PY

      - name: Reject confidential document formats
        run: |
          forbidden="$(find . -type f \
            \( -iname '*.pdf' -o -iname '*.doc' -o -iname '*.docx' -o -iname '*.xls' -o -iname '*.xlsx' -o -iname '*.xlsm' -o -iname '*.zip' \) \
            -not -path './.git/*' -print)"
          if [ -n "$forbidden" ]; then
            echo "Confidential-capable document formats must not be committed:"
            echo "$forbidden"
            exit 1
          fi
