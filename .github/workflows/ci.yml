name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/document-api/requirements.txt
      - run: pip install -r apps/document-api/requirements.txt
      - run: python -m compileall -q apps/document-api/app
      - run: pytest -q apps/document-api/tests
      - run: for file in workflows/*.json; do python -m json.tool "$file" >/dev/null; done
      - run: docker compose --env-file .env.example config >/dev/null
