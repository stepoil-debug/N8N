name: Materialize project

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize package
        run: python .bootstrap/materialize.py

      - name: Validate expected structure
        run: |
          test -f README.md
          test -f docker-compose.yml
          test -f apps/document-api/Dockerfile
          test -d workflows
          python -m compileall -q apps/document-api
          for file in workflows/*.json; do python -m json.tool "$file" >/dev/null; done

      - name: Commit materialized project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: materialize STEP industrial audit platform [materialized]"
          git push
