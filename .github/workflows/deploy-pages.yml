name: Deploy STEP Audit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate direct asynchronous client
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/styles.css
          test -f site/zip.css
          test -f site/results.css
          test -f site/drawings.css
          test -f site/config.js
          test -f site/app.js
          test -f site/progress.js
          test -f site/drawings.js
          test -f site/drawing-profile-scope.js
          grep -q "queueBaseUrl" site/config.js
          grep -q "step-audit-queue" site/config.js
          grep -q "uploadToSignedUrl" site/app.js
          grep -q "analysis_completed" site/app.js
          grep -q "requestQueue('submit'" site/app.js
          grep -q "audit-progress" site/progress.js
          grep -q "progressFor" site/progress.js
          grep -q "view-drawing-analysis" site/index.html
          grep -q "client-profile:" site/drawings.js
          grep -q "analysisType: 'drawing'" site/drawings.js
          grep -q "hi39520" site/drawing-profile-scope.js
          if grep -q "app-parts/" site/app.js; then
            echo "O frontend ainda depende de blocos fragmentados."
            exit 1
          fi
          node --check site/config.js
          node --check site/app.js
          node --check site/progress.js
          node --check site/drawings.js
          node --check site/drawing-profile-scope.js

      - name: Prepare versioned Pages artifact
        shell: bash
        env:
          VERSION: 1.6.${{ github.run_number }}
          ASSET_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/step-audit-pages
          cp -R site /tmp/step-audit-pages
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          root = Path('/tmp/step-audit-pages')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          version = os.environ['VERSION']
          asset = os.environ['ASSET_VERSION']

          text = re.sub(r'STEP Audit One · v[^<]+', f'STEP Audit One · v{version}', text)
          if 'src="progress.js"' not in text:
              text = text.replace(
                  '<script src="app.js" defer></script>',
                  '<script src="app.js" defer></script>\n  <script src="progress.js" defer></script>',
              )
          if 'src="drawing-profile-scope.js"' not in text:
              text = text.replace(
                  '<script src="drawings.js" defer></script>',
                  '<script src="drawings.js" defer></script>\n  <script src="drawing-profile-scope.js" defer></script>',
              )
          for filename in ('styles.css', 'zip.css', 'results.css', 'drawings.css', 'config.js', 'app.js', 'progress.js', 'drawings.js', 'drawing-profile-scope.js'):
              text = re.sub(
                  rf'{re.escape(filename)}(?:\?v=[^"\']+)?',
                  f'{filename}?v={asset}',
                  text,
              )

          viewport = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          if 'http-equiv="Cache-Control"' not in text:
              text = text.replace(
                  viewport,
                  viewport + '\n'
                  '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
                  '  <meta http-equiv="Pragma" content="no-cache">\n'
                  '  <meta http-equiv="Expires" content="0">',
              )
          index.write_text(text, encoding='utf-8')

          build = {
              'application': 'STEP Audit One',
              'version': version,
              'commit': asset,
              'frontend_mode': 'direct_asynchronous_queue',
              'progress_mode': 'status_and_pipeline_stage',
              'drawing_mode': 'client_isolated_visual_audit',
              'client_conditionals': 'per_client_and_per_execution',
              'project_profile_guard': True,
              'queue': 'supabase_private',
              'orchestrator': 'n8n_and_specialized_drawing_worker',
              'model_provider': 'github_models',
          }
          (root / 'build.json').write_text(json.dumps(build, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / '.nojekyll').touch()
          print(f'Artifact preparado: STEP Audit One v{version} / {asset[:12]}')
          PY

          node --check /tmp/step-audit-pages/app.js
          node --check /tmp/step-audit-pages/progress.js
          node --check /tmp/step-audit-pages/drawings.js
          node --check /tmp/step-audit-pages/drawing-profile-scope.js
          grep -q "STEP Audit One · v1.6." /tmp/step-audit-pages/index.html
          grep -q "app.js?v=${GITHUB_SHA}" /tmp/step-audit-pages/index.html
          grep -q "progress.js?v=${GITHUB_SHA}" /tmp/step-audit-pages/index.html
          grep -q "drawings.js?v=${GITHUB_SHA}" /tmp/step-audit-pages/index.html
          grep -q "drawing-profile-scope.js?v=${GITHUB_SHA}" /tmp/step-audit-pages/index.html
          grep -q '"drawing_mode": "client_isolated_visual_audit"' /tmp/step-audit-pages/build.json
          grep -q '"project_profile_guard": true' /tmp/step-audit-pages/build.json

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/step-audit-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
