name: Deploy STEP Audit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate complete audit interface
        shell: bash
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/zip.css
          test -f site/results.css
          test -f site/config.js
          test -f site/app.js
          grep -q "STEP Audit" site/index.html
          grep -q "packageFile" site/index.html
          grep -q "view-results" site/index.html
          grep -q "Proposta revisada" site/index.html
          grep -q "analysis_completed" site/app.js
          node --check site/app.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
