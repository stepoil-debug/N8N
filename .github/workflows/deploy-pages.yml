name: Deploy STEP Audit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build validated Pages artifact
        shell: bash
        env:
          VERSION: 1.4.${{ github.run_number }}
          ASSET_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/styles.css
          test -f site/zip.css
          test -f site/results.css
          test -f site/config.js
          test -f site/app-parts/app-00.b64
          test -f site/app-parts/app-01.b64
          test -f site/app-parts/app-02.b64
          grep -q "STEP Audit" site/index.html
          grep -q "packageFile" site/index.html
          grep -q "view-results" site/index.html
          grep -q "Proposta revisada" site/index.html
          grep -q "queueBaseUrl" site/config.js
          node --check site/config.js

          rm -rf /tmp/step-audit-pages
          cp -R site /tmp/step-audit-pages

          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import os

          source_root = Path('site')
          stage_root = Path('/tmp/step-audit-pages')
          parts = sorted((source_root / 'app-parts').glob('app-*.b64'))
          if len(parts) != 3:
              raise SystemExit(f'Esperados 3 blocos do aplicativo; encontrados {len(parts)}')

          encoded = ''.join(part.read_text(encoding='utf-8') for part in parts)
          encoded = ''.join(encoded.split())
          encoded += '=' * (-len(encoded) % 4)
          compressed = base64.b64decode(encoded)
          source = gzip.decompress(compressed).decode('utf-8')

          required = ('analysis_completed', 'queueBaseUrl', 'step-audit-queue')
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit('Cliente assíncrono incompleto: ' + ', '.join(missing))

          bundle = stage_root / 'app.bundle.js'
          bundle.write_text(source, encoding='utf-8')

          index = stage_root / 'index.html'
          text = index.read_text(encoding='utf-8')
          version = os.environ['VERSION']
          asset = os.environ['ASSET_VERSION']
          text = text.replace('STEP Audit One · v1.3', f'STEP Audit One · v{version}')
          text = text.replace('STEP Audit One · v1.4', f'STEP Audit One · v{version}')
          replacements = {
              'href="styles.css"': f'href="styles.css?v={asset}"',
              'href="zip.css"': f'href="zip.css?v={asset}"',
              'href="results.css"': f'href="results.css?v={asset}"',
              'src="config.js"': f'src="config.js?v={asset}"',
              'src="app.js" defer': f'src="app.bundle.js?v={asset}" defer',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = text.replace(
              '<meta name="viewport" content="width=device-width,initial-scale=1">',
              '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
              '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
              '  <meta http-equiv="Pragma" content="no-cache">\n'
              '  <meta http-equiv="Expires" content="0">',
          )
          index.write_text(text, encoding='utf-8')

          (stage_root / '.nojekyll').touch()
          print(f'Artifact preparado: STEP Audit One v{version}; bundle com {len(source)} caracteres')
          PY

          node --check /tmp/step-audit-pages/app.bundle.js
          grep -q "STEP Audit One · v1.4." /tmp/step-audit-pages/index.html
          grep -q "config.js?v=${GITHUB_SHA}" /tmp/step-audit-pages/index.html
          grep -q "app.bundle.js?v=${GITHUB_SHA}" /tmp/step-audit-pages/index.html
          grep -q "analysis_completed" /tmp/step-audit-pages/app.bundle.js
          rm -rf /tmp/step-audit-pages/app-parts /tmp/step-audit-pages/app.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/step-audit-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
